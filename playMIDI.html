<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>88-Key Physical Panning Visualizer</title>
    <!-- Tone.js MIDIパーサーCDN -->
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        .description { color: #888; margin-bottom: 20px; font-size: 0.9rem; }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: #1e1e1e;
            padding: 15px 25px;
            border-radius: 8px;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-control input[type="range"] {
            cursor: pointer;
        }
        #volume-val {
            min-width: 45px;
            font-variant-numeric: tabular-nums;
            color: #00e676;
            font-weight: bold;
        }
        /* ピアノUI */
        #piano-container {
            position: relative;
            height: 120px;
            width: 1000px;
            background: #000;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 20px;
        }
        .key {
            position: absolute;
            bottom: 0;
            box-sizing: border-box;
            border-radius: 0 0 3px 3px;
        }
        .white-key {
            background: #fff;
            height: 100%;
            border: 1px solid #ccc;
            z-index: 1;
        }
        .white-key.active { background: #4caf50 !important; }
        .black-key {
            background: #222;
            height: 60%;
            border: 1px solid #000;
            z-index: 2;
        }
        .black-key.active { background: #81c784 !important; }
        #speaker-info {
            display: flex;
            justify-content: space-between;
            width: 1000px;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #00e676;
        }
    </style>
</head>
<body>

    <h1>88-Key Physical Panning Player</h1>
    <div class="description">左右スピーカー間隔: 52cm モデリング空間（MIDIノートによる厳密な定位制御）</div>

    <div class="controls">
        <input type="file" id="midi-upload" accept=".mid,.midi">
        <button id="play-btn" disabled>再生</button>
        <button id="stop-btn" disabled>停止</button>
        <label>
            定位モード:
            <select id="pan-mode">
                <option value="stereo">StereoPanner (強度パン)</option>
                <option value="3d">Panner3D (HRTF空間定位 / 52cm実寸)</option>
            </select>
        </label>
        <!-- 音量コントロール (0%〜300%) -->
        <div class="volume-control">
            <label for="volume-slider">音量:</label>
            <input type="range" id="volume-slider" min="0" max="300" value="100" step="5">
            <span id="volume-val">100%</span>
        </div>
    </div>

    <!-- 鍵盤描画領域 -->
    <div id="piano-container"></div>
    <div id="speaker-info">
        <span>◀ L-ch (-26cm / Note 21: A0)</span>
        <span>Center (0cm / F4付近)</span>
        <span>R-ch (+26cm / Note 108: C8) ▶</span>
    </div>

<script>
    const PHYSICAL_WIDTH_METERS = 0.52; // 52cm = 0.52m
    const HALF_WIDTH = PHYSICAL_WIDTH_METERS / 2; // 0.26m
    const LISTENER_Z_DISTANCE = 0.50; // リスナーと鍵盤の距離 (50cm)

    let audioCtx = null;
    let masterGainNode = null;
    let compressorNode = null;
    let midiData = null;
    let scheduledEvents = [];
    let isPlaying = false;
    let startTime = 0;

    // 88鍵の初期化情報 (A0=21, C8=108)
    const keysMap = new Map();
    const container = document.getElementById('piano-container');

    // UI: ピアノ鍵盤を物理的に整列生成
    function createPianoUI() {
        const totalWhiteKeys = 52;
        const keyWidthPercent = 100 / totalWhiteKeys;
        let whiteKeyIndex = 0;

        for (let midi = 21; midi <= 108; midi++) {
            const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
            const el = document.createElement('div');
            el.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            el.dataset.note = midi;

            if (!isBlack) {
                el.style.left = `${whiteKeyIndex * keyWidthPercent}%`;
                el.style.width = `${keyWidthPercent}%`;
                whiteKeyIndex++;
            } else {
                // 黒鍵の水平位置計算
                el.style.left = `${(whiteKeyIndex - 0.7) * keyWidthPercent}%`;
                el.style.width = `${keyWidthPercent * 0.7}%`;
            }
            container.appendChild(el);
            keysMap.set(midi, el);
        }
    }
    createPianoUI();

    // 音量スライダーUI同期
    const volumeSlider = document.getElementById('volume-slider');
    const volumeVal = document.getElementById('volume-val');
    volumeSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        volumeVal.textContent = `${val}%`;
        if (masterGainNode && audioCtx) {
            masterGainNode.gain.setValueAtTime(val / 100, audioCtx.currentTime);
        }
    });

    // オーディオコンテキストおよびマスター系統の初期化
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // マスターゲインノード
            masterGainNode = audioCtx.createGain();
            const currentVolume = parseFloat(volumeSlider.value) / 100;
            masterGainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);

            // 音量100%超え時の強烈な歪み/音割れを保護するリミッター（コンプレッサー）
            compressorNode = audioCtx.createDynamicsCompressor();
            compressorNode.threshold.setValueAtTime(-3, audioCtx.currentTime); // -3dBから抑制
            compressorNode.knee.setValueAtTime(6, audioCtx.currentTime);
            compressorNode.ratio.setValueAtTime(20, audioCtx.currentTime); // ハードリミット寄り
            compressorNode.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressorNode.release.setValueAtTime(0.1, audioCtx.currentTime);

            // 結線: 各ノート -> masterGain -> compressor -> 出力スピーカー
            masterGainNode.connect(compressorNode);
            compressorNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // MIDIノートから周波数を計算
    function midiToFreq(note) {
        return 440 * Math.pow(2, (note - 69) / 12);
    }

    // ノートごとのパンニング・ノードの構築
    function createPanningNode(midiNote, mode) {
        const norm = (midiNote - 21) / (108 - 21);

        if (mode === '3d') {
            const panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';

            const xPos = -HALF_WIDTH + (norm * PHYSICAL_WIDTH_METERS);
            const yPos = 0.0;
            const zPos = -LISTENER_Z_DISTANCE;

            panner.positionX.setValueAtTime(xPos, audioCtx.currentTime);
            panner.positionY.setValueAtTime(yPos, audioCtx.currentTime);
            panner.positionZ.setValueAtTime(zPos, audioCtx.currentTime);
            return panner;
        } else {
            const panVal = (norm * 2.0) - 1.0;
            const panner = audioCtx.createStereoPanner();
            panner.pan.setValueAtTime(panVal, audioCtx.currentTime);
            return panner;
        }
    }

    // ピアノ調の音を合成・発音
    function playNote(midiNote, velocity, time, duration, mode) {
        const freq = midiToFreq(midiNote);

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(freq, time);
        osc2.frequency.setValueAtTime(freq * 2, time);

        const noteGain = audioCtx.createGain();
        const baseVol = (velocity / 127) * 0.3;

        noteGain.gain.setValueAtTime(0.0001, time);
        noteGain.gain.exponentialRampToValueAtTime(baseVol, time + 0.005);
        noteGain.gain.exponentialRampToValueAtTime(baseVol * 0.4, time + 0.15);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, time + duration + 0.1);

        const panner = createPanningNode(midiNote, mode);

        // 結線: ノート音源 -> パン -> マスターゲイン
        osc1.connect(noteGain);
        osc2.connect(noteGain);
        noteGain.connect(panner);
        panner.connect(masterGainNode); // マスターノードへ接続

        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + duration + 0.15);
        osc2.stop(time + duration + 0.15);

        scheduleKeyVisual(midiNote, time, duration);
    }

    // 鍵盤のアニメーション
    function scheduleKeyVisual(midiNote, triggerTime, duration) {
        const delayMs = Math.max(0, (triggerTime - audioCtx.currentTime) * 1000);
        const timerId = setTimeout(() => {
            const keyEl = keysMap.get(midiNote);
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => {
                    keyEl.classList.remove('active');
                }, duration * 1000);
            }
        }, delayMs);
        scheduledEvents.push(timerId);
    }

    // ファイルアップロード
    document.getElementById('midi-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const arrayBuffer = await file.arrayBuffer();
        midiData = new Midi(arrayBuffer);
        document.getElementById('play-btn').disabled = false;
    });

    // 再生
    document.getElementById('play-btn').addEventListener('click', () => {
        if (!midiData) return;
        initAudio();

        isPlaying = true;
        document.getElementById('play-btn').disabled = true;
        document.getElementById('stop-btn').disabled = false;

        const panMode = document.getElementById('pan-mode').value;
        const now = audioCtx.currentTime + 0.1;
        startTime = now;

        midiData.tracks.forEach(track => {
            track.notes.forEach(note => {
                if (note.midi >= 21 && note.midi <= 108) {
                    playNote(
                        note.midi,
                        note.velocity,
                        now + note.time,
                        note.duration,
                        panMode
                    );
                }
            });
        });
    });

    // 停止
    document.getElementById('stop-btn').addEventListener('click', () => {
        scheduledEvents.forEach(id => clearTimeout(id));
        scheduledEvents = [];
        if (audioCtx) {
            audioCtx.close();
            audioCtx = null;
            masterGainNode = null;
            compressorNode = null;
        }
        document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
        document.getElementById('play-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
        isPlaying = false;
    });
</script>
</body>
</html>
