<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDI Player – 88-Key Physical Panning</title>

  <!-- SpessaSynth: 高性能 AudioWorklet ベース SF2/SF3 シンセ -->
  <script type="importmap">
  {
    "imports": {
      "spessasynth_lib": "https://cdn.jsdelivr.net/npm/spessasynth_lib@4/+esm",
      "spessasynth_core": "https://cdn.jsdelivr.net/npm/spessasynth_core@4/+esm"
    }
  }
  </script>

  <style>
    :root {
      --bg: #0e0f13;
      --panel: #1a1d24;
      --border: #2c3040;
      --text: #e0e2ea;
      --sub: #7a8299;
      --acc: #4da3ff;
      --green: #30a46c;
      --red: #e5484d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      min-height: 100vh;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 20px; }

    /* ─── コントロールパネル ─── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    .panel-title {
      width: 100%;
      font-size: 12px;
      font-weight: 600;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 2px;
    }
    label { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
    select, input[type=range] {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    select { padding: 5px 8px; cursor: pointer; }
    input[type=range] { cursor: pointer; accent-color: var(--acc); width: 120px; }
    input[type=file] { font: inherit; color: var(--sub); font-size: 12px; }

    button {
      font: inherit;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    button:hover:not(:disabled) { border-color: var(--acc); }
    button:disabled { opacity: .4; cursor: default; }
    button.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.1); }
    button.danger { color: var(--red); border-color: var(--red); }

    .val { min-width: 38px; font-variant-numeric: tabular-nums; color: var(--acc); font-weight: 600; font-size: 13px; }

    /* ─── ステータスバー ─── */
    #status-bar {
      width: 100%;
      max-width: 900px;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--sub);
      flex-shrink: 0;
    }
    #status-dot.ok   { background: var(--green); }
    #status-dot.warn { background: #f5a524; }
    #status-dot.err  { background: var(--red); }
    #status-dot.play { background: var(--acc); animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { opacity: .3; } }

    /* ─── シークバー ─── */
    #seek-wrap {
      width: 100%;
      max-width: 900px;
      margin-bottom: 12px;
      display: none;
    }
    #seek-wrap.visible { display: block; }
    #seek-bar {
      width: 100%;
      accent-color: var(--acc);
      cursor: pointer;
    }
    #time-label {
      font-size: 11px;
      color: var(--sub);
      text-align: right;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ─── ピアノ鍵盤 ─── */
    #piano-wrap {
      width: 100%;
      max-width: 900px;
    }
    #piano-container {
      position: relative;
      height: 110px;
      width: 100%;
      background: #0a0b0e;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .key { position: absolute; bottom: 0; border-radius: 0 0 3px 3px; }
    .white-key {
      background: #f0f0f0;
      height: 100%;
      border-right: 1px solid #bbb;
      z-index: 1;
      transition: background .04s;
    }
    .black-key {
      background: #1a1a1a;
      height: 62%;
      border: 1px solid #000;
      z-index: 2;
      transition: background .04s;
    }
    /* チャンネル別に色分け（10色ループ） */
    .active-0  { background: #4da3ff !important; }
    .active-1  { background: #30a46c !important; }
    .active-2  { background: #f5a524 !important; }
    .active-3  { background: #e5484d !important; }
    .active-4  { background: #d6409f !important; }
    .active-5  { background: #6e56cf !important; }
    .active-6  { background: #12a594 !important; }
    .active-7  { background: #f76b15 !important; }
    .active-8  { background: #a3d900 !important; }
    .active-9  { background: #ffd60a !important; } /* ドラム */
    .active-10 { background: #00b8d9 !important; }
    .active-11 { background: #3b82f6 !important; }
    .active-12 { background: #ec4899 !important; }
    .active-13 { background: #8b5cf6 !important; }
    .active-14 { background: #14b8a6 !important; }
    .active-15 { background: #f97316 !important; }

    #speaker-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 4px;
      font-size: 11px;
      color: var(--sub);
    }

    /* ─── チャンネル凡例 ─── */
    #ch-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      width: 100%;
      max-width: 900px;
      margin-top: 12px;
      font-size: 11px;
    }
    .ch-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--sub);
      opacity: 0;
      transition: opacity .2s;
    }
    .ch-chip.active { opacity: 1; }
    .ch-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* ─── ローディング オーバーレイ ─── */
    #sf-loader {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 12px;
    }
    #sf-loader.show { display: flex; }
    #sf-loader p { font-size: 14px; color: var(--text); }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>🎹 MIDI Player – 88-Key Physical Panning</h1>
<p class="subtitle">SpessaSynth (AudioWorklet) + SoundFont サンプル再生 ／ ノート数が多くてもフリーズしません</p>

<!-- ─── ファイル読み込み ─── -->
<div class="panel">
  <span class="panel-title">ファイル</span>
  <label>MIDI <input type="file" id="midi-upload" accept=".mid,.midi,.kar"></label>
  <label>SoundFont (SF2/SF3)
    <input type="file" id="sf-upload" accept=".sf2,.sf3,.sfogg,.dls">
  </label>
  <button id="sf-default-btn">🌐 デフォルト SF を使う</button>
</div>

<!-- ─── 再生コントロール ─── -->
<div class="panel">
  <span class="panel-title">再生</span>
  <button id="play-btn"  class="primary" disabled>▶ 再生</button>
  <button id="pause-btn" disabled>⏸ 一時停止</button>
  <button id="stop-btn"  class="danger" disabled>■ 停止</button>
  <label>
    定位モード
    <select id="pan-mode">
      <option value="stereo">StereoPanner（強度パン）</option>
      <option value="3d">Panner3D・HRTF（52cm 実寸空間）</option>
    </select>
  </label>
  <label>
    音量
    <input type="range" id="vol-slider" min="0" max="200" value="100" step="1">
    <span class="val" id="vol-val">100%</span>
  </label>
  <label>
    テンポ
    <input type="range" id="tempo-slider" min="25" max="300" value="100" step="1">
    <span class="val" id="tempo-val">100%</span>
  </label>
</div>

<!-- ─── ステータス ─── -->
<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-msg">SoundFont を読み込んでください</span>
</div>

<!-- ─── シークバー ─── -->
<div id="seek-wrap">
  <input type="range" id="seek-bar" min="0" max="1000" value="0">
  <div id="time-label">0:00 / 0:00</div>
</div>

<!-- ─── 鍵盤 ─── -->
<div id="piano-wrap">
  <div id="piano-container"></div>
  <div id="speaker-info">
    <span>◀ L (A0 / Note 21)</span>
    <span>Center (F4 付近)</span>
    <span>R (C8 / Note 108) ▶</span>
  </div>
</div>

<!-- ─── チャンネル凡例 ─── -->
<div id="ch-legend"></div>

<!-- ─── ローディング ─── -->
<div id="sf-loader">
  <div class="spinner"></div>
  <p id="sf-loader-msg">SoundFont を読み込み中…</p>
</div>

<script type="module">
import { WorkletSynthesizer, SpessaSynthSequencer, BasicMIDI }
  from 'spessasynth_lib';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  定数
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const PHYSICAL_WIDTH = 0.52;   // 52cm スピーカー幅
const HALF_WIDTH     = PHYSICAL_WIDTH / 2;
const LISTENER_Z     = 0.50;

const CH_COLORS = [
  '#4da3ff','#30a46c','#f5a524','#e5484d',
  '#d6409f','#6e56cf','#12a594','#f76b15',
  '#a3d900','#ffd60a','#00b8d9','#3b82f6',
  '#ec4899','#8b5cf6','#14b8a6','#f97316',
];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DOM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const $ = id => document.getElementById(id);
const playBtn   = $('play-btn');
const pauseBtn  = $('pause-btn');
const stopBtn   = $('stop-btn');
const volSlider = $('vol-slider');
const volVal    = $('vol-val');
const tempoSlider = $('tempo-slider');
const tempoVal    = $('tempo-val');
const seekBar   = $('seek-bar');
const timeLabel = $('time-label');
const seekWrap  = $('seek-wrap');
const statusDot = $('status-dot');
const statusMsg = $('status-msg');
const sfLoader  = $('sf-loader');
const sfLoaderMsg = $('sf-loader-msg');
const container = $('piano-container');
const legend    = $('ch-legend');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  状態
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let audioCtx  = null;
let synth     = null;
let sequencer = null;
let sfBuffer  = null;      // 読み込み済みの SF バイト列
let midiParsed = null;     // BasicMIDI オブジェクト
let isPlaying = false;
let isPaused  = false;
let seekTimer = null;
// note → Set<ch> (同時押し追跡)
const activeNotes = new Map();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ステータス表示
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setStatus(msg, kind = '') {
  statusMsg.textContent = msg;
  statusDot.className = kind;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  88 鍵盤 UI 生成
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const keysMap = new Map();

(function buildPiano() {
  const totalWhite = 52;
  const wPct = 100 / totalWhite;
  let wi = 0;
  for (let m = 21; m <= 108; m++) {
    const isBlack = [1,3,6,8,10].includes(m % 12);
    const el = document.createElement('div');
    el.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
    el.dataset.note = m;
    if (!isBlack) {
      el.style.left  = `${wi * wPct}%`;
      el.style.width = `${wPct}%`;
      wi++;
    } else {
      el.style.left  = `${(wi - 0.68) * wPct}%`;
      el.style.width = `${wPct * 0.65}%`;
    }
    container.appendChild(el);
    keysMap.set(m, el);
  }
})();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  チャンネル凡例
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const chChips = [];
for (let ch = 0; ch < 16; ch++) {
  const chip = document.createElement('div');
  chip.className = 'ch-chip';
  chip.dataset.ch = ch;
  const dot = document.createElement('div');
  dot.className = 'ch-dot';
  dot.style.background = CH_COLORS[ch];
  const lbl = document.createElement('span');
  lbl.textContent = ch === 9 ? `Ch${ch+1} Drum` : `Ch${ch+1}`;
  chip.appendChild(dot);
  chip.appendChild(lbl);
  legend.appendChild(chip);
  chChips.push(chip);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  鍵盤ノート ON / OFF
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function noteOn(note, ch) {
  if (note < 21 || note > 108) return;
  if (!activeNotes.has(note)) activeNotes.set(note, new Set());
  activeNotes.get(note).add(ch);
  const el = keysMap.get(note);
  if (!el) return;
  // すべての active-* クラスを除去して最高優先度 ch を適用
  refreshKey(note);
  chChips[ch]?.classList.add('active');
}
function noteOff(note, ch) {
  if (note < 21 || note > 108) return;
  const s = activeNotes.get(note);
  if (s) { s.delete(ch); if (s.size === 0) activeNotes.delete(note); }
  refreshKey(note);
  // ch を使っているノートが他にあるかチェック
  const chStillActive = [...activeNotes.values()].some(s => s.has(ch));
  if (!chStillActive) chChips[ch]?.classList.remove('active');
}
function refreshKey(note) {
  const el = keysMap.get(note);
  if (!el) return;
  // 既存の active クラスを全解除
  for (let i = 0; i < 16; i++) el.classList.remove(`active-${i}`);
  const s = activeNotes.get(note);
  if (s && s.size > 0) {
    const ch = s.values().next().value; // 最初の ch
    el.classList.add(`active-${ch}`);
  }
}
function allNotesOff() {
  activeNotes.clear();
  for (let m = 21; m <= 108; m++) {
    const el = keysMap.get(m);
    if (el) for (let i = 0; i < 16; i++) el.classList.remove(`active-${i}`);
  }
  chChips.forEach(c => c.classList.remove('active'));
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  パンニングノード生成（1 note 用）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function makePanner(note) {
  const norm = (note - 21) / (108 - 21);
  const mode = $('pan-mode').value;
  if (mode === '3d') {
    const panner = audioCtx.createPanner();
    panner.panningModel  = 'HRTF';
    panner.distanceModel = 'inverse';
    const x = -HALF_WIDTH + norm * PHYSICAL_WIDTH;
    panner.positionX.setValueAtTime(x, audioCtx.currentTime);
    panner.positionY.setValueAtTime(0, audioCtx.currentTime);
    panner.positionZ.setValueAtTime(-LISTENER_Z, audioCtx.currentTime);
    return panner;
  } else {
    const panner = audioCtx.createStereoPanner();
    panner.pan.setValueAtTime(norm * 2 - 1, audioCtx.currentTime);
    return panner;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  AudioContext + SpessaSynth 初期化
//  (ユーザー操作後に呼ぶ)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function initAudio() {
  if (synth) return; // 既存

  audioCtx = new AudioContext({ latencyHint: 'interactive' });

  setStatus('AudioWorklet を初期化中…', 'warn');

  // SpessaSynth processor を CDN から追加
  await audioCtx.audioWorklet.addModule(
    'https://cdn.jsdelivr.net/npm/spessasynth_lib@4/dist/spessasynth_processor.min.js'
  );

  synth = new WorkletSynthesizer(audioCtx);

  // --- パンニングのため synth 出力を各ノートに分けるには、
  //     SpessaSynth は出力を audioCtx.destination に直結させる仕様のため
  //     マスターゲイン → コンプレッサー → destination の簡潔な構成を使用
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = parseFloat(volSlider.value) / 100;

  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -6;
  compressor.knee.value = 6;
  compressor.ratio.value = 8;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.15;

  synth.connect(masterGain);
  masterGain.connect(compressor);
  compressor.connect(audioCtx.destination);

  // 音量スライダーを masterGain に接続
  volSlider.addEventListener('input', () => {
    const v = parseFloat(volSlider.value) / 100;
    volVal.textContent = `${volSlider.value}%`;
    masterGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.05);
  });

  // SoundFont をロード
  setStatus('SoundFont をシンセに転送中…', 'warn');
  await synth.soundBankManager.addSoundBank(sfBuffer, 'main');
  await synth.isReady;
  setStatus('SoundFont 読み込み完了。MIDIファイルを選択してください', 'ok');

  // noteOn / noteOff イベントで鍵盤ビジュアル更新
  synth.eventHandler.addEvent('noteOn', e => {
    noteOn(e.midiNote, e.channel);
  });
  synth.eventHandler.addEvent('noteOff', e => {
    noteOff(e.midiNote, e.channel);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SoundFont 読み込み（ファイル）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('sf-upload').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  sfLoaderMsg.textContent = `${file.name} を読み込み中…`;
  sfLoader.classList.add('show');
  try {
    sfBuffer = await file.arrayBuffer();
    setStatus(`SF: ${file.name} — 再生ボタンを押してください`, 'ok');
    // synth が既に存在する場合はサウンドフォントを差し替え
    if (synth) {
      await synth.soundBankManager.addSoundBank(sfBuffer, 'main');
      await synth.isReady;
    }
    updatePlayBtn();
  } catch(err) {
    setStatus('SoundFont 読み込みエラー: ' + err.message, 'err');
  } finally {
    sfLoader.classList.remove('show');
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SoundFont 読み込み（デフォルト / ネット）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('sf-default-btn').addEventListener('click', async () => {
  // GeneralUser GS (約 30MB SF2 ファイル – Internet Archive)
  const SF_URL = 'https://archive.org/download/free-soundfonts-sf2-2019-04/GeneralUser%20GS%20v1.471.sf2';
  sfLoaderMsg.textContent = 'GeneralUser GS をダウンロード中… (初回のみ / ~30MB)';
  sfLoader.classList.add('show');
  setStatus('デフォルト SoundFont をダウンロード中…', 'warn');
  try {
    const res = await fetch(SF_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    sfBuffer = await res.arrayBuffer();
    if (synth) {
      await synth.soundBankManager.addSoundBank(sfBuffer, 'main');
      await synth.isReady;
    }
    setStatus('GeneralUser GS 読み込み完了', 'ok');
    updatePlayBtn();
  } catch(err) {
    setStatus('ダウンロード失敗: ' + err.message + ' — ローカルファイルをお試しください', 'err');
  } finally {
    sfLoader.classList.remove('show');
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MIDI ファイル読み込み
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('midi-upload').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    midiParsed = new BasicMIDI(new Uint8Array(buf));
    setStatus(`MIDI: ${file.name} (${formatTime(midiParsed.duration)})`, sfBuffer ? 'ok' : 'warn');
    seekWrap.classList.add('visible');
    seekBar.value = 0;
    timeLabel.textContent = `0:00 / ${formatTime(midiParsed.duration)}`;
    updatePlayBtn();
  } catch(err) {
    setStatus('MIDI 読み込みエラー: ' + err.message, 'err');
  }
});

function updatePlayBtn() {
  playBtn.disabled = !(sfBuffer && midiParsed);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  再生
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
playBtn.addEventListener('click', async () => {
  if (!sfBuffer || !midiParsed) return;

  // 初回 or 停止後の初期化
  if (!synth) {
    sfLoaderMsg.textContent = 'シンセを初期化中…';
    sfLoader.classList.add('show');
    try {
      await initAudio();
    } catch(err) {
      setStatus('初期化エラー: ' + err.message, 'err');
      sfLoader.classList.remove('show');
      return;
    }
    sfLoader.classList.remove('show');
  }

  if (audioCtx.state === 'suspended') await audioCtx.resume();

  if (isPaused && sequencer) {
    // 一時停止からの再開
    sequencer.play();
    isPaused = false;
  } else {
    // 新規再生
    if (sequencer) {
      sequencer.stop?.();
      sequencer = null;
    }
    allNotesOff();

    sequencer = new SpessaSynthSequencer(synth, midiParsed);
    sequencer.play();

    // テンポ適用
    sequencer.playbackRate = parseFloat(tempoSlider.value) / 100;
  }

  isPlaying = true;
  isPaused  = false;
  setStatus('再生中…', 'play');
  playBtn.disabled  = true;
  pauseBtn.disabled = false;
  stopBtn.disabled  = false;

  startSeekUpdate();
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  一時停止
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
pauseBtn.addEventListener('click', () => {
  if (!sequencer) return;
  if (!isPaused) {
    sequencer.pause?.();
    isPaused  = true;
    isPlaying = false;
    setStatus('一時停止', 'warn');
    playBtn.disabled  = false;
    pauseBtn.disabled = true;
    stopSeekUpdate();
    allNotesOff();
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  停止
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
stopBtn.addEventListener('click', () => {
  stopPlayback();
});

function stopPlayback() {
  if (sequencer) {
    try { sequencer.stop?.(); } catch(_) {}
    sequencer = null;
  }
  allNotesOff();
  isPlaying = false;
  isPaused  = false;
  playBtn.disabled  = !(sfBuffer && midiParsed);
  pauseBtn.disabled = true;
  stopBtn.disabled  = true;
  setStatus(midiParsed
    ? `MIDI: ${$('midi-upload').files[0]?.name ?? ''} — 停止`
    : 'MIDI ファイルを選択してください', sfBuffer ? 'ok' : '');
  seekBar.value = 0;
  if (midiParsed) timeLabel.textContent = `0:00 / ${formatTime(midiParsed.duration)}`;
  stopSeekUpdate();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  シーク
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
seekBar.addEventListener('input', () => {
  if (!sequencer || !midiParsed) return;
  const t = (seekBar.value / 1000) * midiParsed.duration;
  sequencer.currentTime = t;
  timeLabel.textContent = `${formatTime(t)} / ${formatTime(midiParsed.duration)}`;
  allNotesOff();
});

function startSeekUpdate() {
  stopSeekUpdate();
  seekTimer = setInterval(() => {
    if (!sequencer || !midiParsed) return;
    const t = sequencer.currentTime ?? 0;
    const d = midiParsed.duration;
    seekBar.value = Math.min(1000, (t / d) * 1000);
    timeLabel.textContent = `${formatTime(t)} / ${formatTime(d)}`;
    // 終了検知
    if (t >= d - 0.1) {
      stopPlayback();
    }
  }, 200);
}
function stopSeekUpdate() {
  if (seekTimer) { clearInterval(seekTimer); seekTimer = null; }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  テンポ
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
tempoSlider.addEventListener('input', () => {
  tempoVal.textContent = `${tempoSlider.value}%`;
  if (sequencer) sequencer.playbackRate = parseFloat(tempoSlider.value) / 100;
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ユーティリティ
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function formatTime(sec) {
  if (!isFinite(sec)) return '?:??';
  const s = Math.floor(sec);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
</script>
</body>
</html>
