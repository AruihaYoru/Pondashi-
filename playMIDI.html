<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDI Player</title>
  <script type="importmap">
  {
    "imports": {
      "spessasynth_lib": "https://cdn.jsdelivr.net/npm/spessasynth_lib@4/+esm",
      "spessasynth_core": "https://cdn.jsdelivr.net/npm/spessasynth_core@4/+esm"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      color: #000;
    }
    .panel {
      background: #fff;
      border: 1px solid #000;
      padding: 14px 16px;
    }
    .panel-header {
      font-size: 12px;
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
    }
    label {
      font-size: 12px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select, input[type=number], input[type=range] {
      background: #fff;
      color: #000;
      border: 1px solid #000;
      font: inherit;
      font-size: 12px;
    }
    select { padding: 4px 6px; }
    input[type=number] {
      width: 64px;
      padding: 3px 6px;
      text-align: right;
    }
    input[type=range] {
      width: 110px;
      accent-color: #000;
      cursor: pointer;
    }
    input[type=file] {
      font-size: 12px;
      color: #000;
    }
    button {
      background: #fff;
      color: #000;
      border: 1px solid #000;
      padding: 5px 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #000;
      color: #fff;
    }
    button:disabled {
      opacity: 0.25;
      cursor: default;
    }
    button.btn-strong {
      background: #000;
      color: #fff;
      font-weight: 700;
    }
    button.btn-strong:hover:not(:disabled) {
      background: #fff;
      color: #000;
    }
    .val-display {
      font-size: 12px;
      color: #000;
      min-width: 44px;
      font-variant-numeric: tabular-nums;
    }

    .stage-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 760px) {
      .stage-layout { grid-template-columns: 420px 1fr; }
    }
    #stage-wrap {
      width: 100%;
      height: 320px;
      background: #fff;
      border: 1px solid #000;
      position: relative;
      touch-action: none;
    }
    #stage-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }
    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    #seek-container {
      display: none;
      margin-bottom: 12px;
    }
    #seek-container.active { display: block; }
    #seek-bar { width: 100%; }
    #time-display {
      font-size: 11px;
      color: #000;
      text-align: right;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    #piano-wrap {
      width: 100%;
      height: 90px;
      background: #fff;
      border: 1px solid #000;
      position: relative;
      overflow: hidden;
    }
    .key { position: absolute; bottom: 0; }
    .white-key {
      background: #fff;
      height: 100%;
      border-right: 1px solid #000;
      z-index: 1;
    }
    .white-key.active { background: #000 !important; }
    .black-key {
      background: #000;
      height: 60%;
      border: 1px solid #000;
      z-index: 2;
    }
    .black-key.active {
      background: #fff !important;
      border: 2px solid #000 !important;
    }

    #status {
      font-size: 12px;
      color: #000;
      margin-top: 6px;
    }
    #loader {
      display: none;
      font-size: 12px;
      color: #000;
      margin-left: 8px;
    }
    #loader.show { display: inline-block; }
  </style>
</head>
<body>

<div class="app">
  <h1>MIDI Player</h1>

  <div class="panel">
    <div class="panel-header">
      <span>2D Speaker Acoustics</span>
      <div class="row" style="gap: 6px;">
        <button id="p-desktop">Desktop (52cm)</button>
        <button id="p-studio">Studio (90cm)</button>
        <button id="p-piano">Piano (123cm)</button>
      </div>
    </div>
    <div class="stage-layout">
      <div id="stage-wrap">
        <canvas id="stage-canvas"></canvas>
      </div>
      <div class="controls-grid">
        <div class="control-item">
          <span>Speaker Spread</span>
          <div class="row" style="gap: 6px;">
            <input type="range" id="spk-dist" min="15" max="300" value="52">
            <input type="number" id="spk-dist-n" min="15" max="300" value="52" step="0.5">
            <span style="font-size: 11px;">cm</span>
          </div>
        </div>
        <div class="control-item">
          <span>Listener Depth</span>
          <div class="row" style="gap: 6px;">
            <input type="range" id="list-depth" min="15" max="300" value="50">
            <input type="number" id="list-depth-n" min="15" max="300" value="50" step="0.5">
            <span style="font-size: 11px;">cm</span>
          </div>
        </div>
        <div class="control-item">
          <span>Listener Offset X</span>
          <div class="row" style="gap: 6px;">
            <input type="range" id="list-x" min="-100" max="100" value="0">
            <input type="number" id="list-x-n" min="-100" max="100" value="0" step="0.5">
            <span style="font-size: 11px;">cm</span>
          </div>
        </div>
        <div class="control-item">
          <span>Toe-in Angle</span>
          <div class="row" style="gap: 6px;">
            <input type="range" id="toein" min="0" max="60" value="15">
            <input type="number" id="toein-n" min="0" max="60" value="15">
            <span style="font-size: 11px;">deg</span>
          </div>
        </div>
        <div class="control-item">
          <span>Acoustic Mode</span>
          <select id="acoustic-mode">
            <option value="hrtf">HRTF 3D (Binaural)</option>
            <option value="direct">Equal Power Stereo</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Sources & Transport</div>
    <div class="row" style="margin-bottom: 12px;">
      <label>MIDI <input type="file" id="midi-in" accept=".mid,.midi"></label>
      <label>SoundFont <input type="file" id="sf-in" accept=".sf2,.sf3"></label>
      <button id="sf-load-default">Default SF (GeneralUser GS)</button>
      <span id="loader">loading...</span>
    </div>
    <div class="row">
      <button id="btn-play" class="btn-strong" disabled>Play</button>
      <button id="btn-pause" disabled>Pause</button>
      <button id="btn-stop" disabled>Stop</button>
      <button id="btn-run-up" disabled>▲ Run Up</button>
      <button id="btn-run-down" disabled>▼ Run Down</button>
      <label style="margin-left: auto;">
        Vol
        <input type="range" id="vol" min="0" max="1000" value="100" step="5">
        <span class="val-display" id="vol-txt">100%</span>
      </label>
      <label>
        Tempo
        <input type="range" id="tempo" min="25" max="300" value="100">
        <span class="val-display" id="tempo-txt">100%</span>
      </label>
    </div>
  </div>

  <div class="panel">
    <div id="seek-container">
      <input type="range" id="seek-bar" min="0" max="1000" value="0">
      <div id="time-display">0:00 / 0:00</div>
    </div>
    <div id="piano-wrap"></div>
    <div id="status">Select SoundFont and MIDI file</div>
  </div>
</div>

<script type="module">
import { WorkletSynthesizer, Sequencer } from 'spessasynth_lib';

const WHITE_KEYS = [
  21, 23, 24, 26, 28, 29, 31, 33, 35, 36,
  38, 40, 41, 43, 45, 47, 48, 50, 52, 53,
  55, 57, 59, 60, 62, 64, 65, 67, 69, 71,
  72, 74, 76, 77, 79, 81, 83, 84, 86, 88,
  89, 91, 93, 95, 96, 98, 100, 101, 103, 105, 107, 108
];

const state = {
  spkDist: 52,
  listenerDepth: 50,
  listenerOffset: 0,
  toeIn: 15,
  acousticMode: 'hrtf',
  vol: 1.0,
  tempo: 1.0,
  isPlaying: false,
  isPaused: false,
  sweepActive: false,
  sweepCancel: false
};

const dom = {
  canvas: document.getElementById('stage-canvas'),
  stageWrap: document.getElementById('stage-wrap'),
  spkDist: document.getElementById('spk-dist'),
  spkDistN: document.getElementById('spk-dist-n'),
  listDepth: document.getElementById('list-depth'),
  listDepthN: document.getElementById('list-depth-n'),
  listX: document.getElementById('list-x'),
  listXN: document.getElementById('list-x-n'),
  toein: document.getElementById('toein'),
  toeinN: document.getElementById('toein-n'),
  mode: document.getElementById('acoustic-mode'),
  play: document.getElementById('btn-play'),
  pause: document.getElementById('btn-pause'),
  stop: document.getElementById('btn-stop'),
  runUp: document.getElementById('btn-run-up'),
  runDown: document.getElementById('btn-run-down'),
  vol: document.getElementById('vol'),
  volTxt: document.getElementById('vol-txt'),
  tempo: document.getElementById('tempo'),
  tempoTxt: document.getElementById('tempo-txt'),
  seekWrap: document.getElementById('seek-container'),
  seek: document.getElementById('seek-bar'),
  time: document.getElementById('time-display'),
  status: document.getElementById('status'),
  loader: document.getElementById('loader'),
  midiIn: document.getElementById('midi-in'),
  sfIn: document.getElementById('sf-in'),
  sfDefault: document.getElementById('sf-load-default'),
  piano: document.getElementById('piano-wrap')
};

const keysMap = new Map();
(function initKeyboard() {
  const totalWhite = 52;
  const widthPct = 100 / totalWhite;
  let whiteIdx = 0;
  for (let m = 21; m <= 108; m++) {
    const isBlack = [1, 3, 6, 8, 10].includes(m % 12);
    const el = document.createElement('div');
    el.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
    if (!isBlack) {
      el.style.left = `${whiteIdx * widthPct}%`;
      el.style.width = `${widthPct}%`;
      whiteIdx++;
    } else {
      el.style.left = `${(whiteIdx - 0.7) * widthPct}%`;
      el.style.width = `${widthPct * 0.7}%`;
    }
    dom.piano.appendChild(el);
    keysMap.set(m, el);
  }
})();

function setKey(note, on) {
  const el = keysMap.get(note);
  if (el) el.classList.toggle('active', on);
}
function clearKeys() {
  for (let [_, el] of keysMap) el.classList.remove('active');
}

let audioCtx = null;
let synth = null;
let sequencer = null;
let masterGain = null;
let splitter = null;
let pannerL = null;
let pannerR = null;
let sfBuffer = null;
let midiBuffer = null;
let midiFileName = '';
let duration = 0;
let seekTimer = null;

async function ensureAudio() {
  if (synth) return;
  dom.loader.classList.add('show');
  dom.status.textContent = 'Initializing AudioWorklet...';

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  await audioCtx.audioWorklet.addModule(
    'https://cdn.jsdelivr.net/npm/spessasynth_lib@4/dist/spessasynth_processor.min.js'
  );

  synth = new WorkletSynthesizer(audioCtx);

  pannerL = audioCtx.createPanner();
  pannerR = audioCtx.createPanner();
  [pannerL, pannerR].forEach(p => {
    p.panningModel = 'HRTF';
    p.distanceModel = 'inverse';
    p.refDistance = 0.5;
    p.coneInnerAngle = 90;
    p.coneOuterAngle = 180;
    p.coneOuterGain = 0.4;
  });

  splitter = audioCtx.createChannelSplitter(2);
  synth.connect(splitter);
  splitter.connect(pannerL, 0);
  splitter.connect(pannerR, 1);

  masterGain = audioCtx.createGain();
  masterGain.gain.value = state.vol;

  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -3;
  comp.knee.value = 6;
  comp.ratio.value = 20;
  comp.attack.value = 0.003;
  comp.release.value = 0.1;

  pannerL.connect(masterGain);
  pannerR.connect(masterGain);
  masterGain.connect(comp);
  comp.connect(audioCtx.destination);

  applyAcoustics();

  if (sfBuffer) {
    dom.status.textContent = 'Uploading SoundFont to worklet...';
    await synth.soundBankManager.addSoundBank(sfBuffer, 'main');
    await synth.isReady;
  }

  synth.eventHandler.addEvent('noteOn', 'key-on', e => setKey(e.midiNote, true));
  synth.eventHandler.addEvent('noteOff', 'key-off', e => setKey(e.midiNote, false));

  sequencer = new Sequencer(synth);
  sequencer.eventHandler.addEvent('songChange', 'seq-change', () => {
    duration = sequencer.duration;
    dom.time.textContent = `0:00 / ${fmtTime(duration)}`;
    dom.status.textContent = `Ready: ${midiFileName} (${fmtTime(duration)})`;
  });

  dom.loader.classList.remove('show');
}

function applyAcoustics() {
  if (!audioCtx || !pannerL || !pannerR) return;
  const now = audioCtx.currentTime;
  const lx = (-state.spkDist / 2 - state.listenerOffset) / 100;
  const rx = (state.spkDist / 2 - state.listenerOffset) / 100;
  const z = -state.listenerDepth / 100;

  if (state.acousticMode === 'hrtf') {
    pannerL.panningModel = 'HRTF';
    pannerR.panningModel = 'HRTF';
    pannerL.positionX.setTargetAtTime(lx, now, 0.05);
    pannerL.positionY.setTargetAtTime(0, now, 0.05);
    pannerL.positionZ.setTargetAtTime(z, now, 0.05);
    pannerR.positionX.setTargetAtTime(rx, now, 0.05);
    pannerR.positionY.setTargetAtTime(0, now, 0.05);
    pannerR.positionZ.setTargetAtTime(z, now, 0.05);

    const rad = (state.toeIn * Math.PI) / 180;
    pannerL.orientationX.setTargetAtTime(Math.sin(rad), now, 0.05);
    pannerL.orientationZ.setTargetAtTime(Math.cos(rad), now, 0.05);
    pannerR.orientationX.setTargetAtTime(Math.sin(-rad), now, 0.05);
    pannerR.orientationZ.setTargetAtTime(Math.cos(-rad), now, 0.05);
  } else {
    pannerL.panningModel = 'equalpower';
    pannerR.panningModel = 'equalpower';
    pannerL.positionX.setTargetAtTime(Math.max(-1, Math.min(1, lx)), now, 0.05);
    pannerR.positionX.setTargetAtTime(Math.max(-1, Math.min(1, rx)), now, 0.05);
    pannerL.positionZ.setTargetAtTime(-1, now, 0.05);
    pannerR.positionZ.setTargetAtTime(-1, now, 0.05);
  }
}

const ctx = dom.canvas.getContext('2d');
let cw = 0, ch = 0;
function resizeCanvas() {
  const r = dom.stageWrap.getBoundingClientRect();
  cw = r.width;
  ch = r.height;
  dom.canvas.width = cw * window.devicePixelRatio;
  dom.canvas.height = ch * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function toScreen(xCm, depthCm) {
  const span = Math.max(state.spkDist, state.listenerDepth, 120) * 1.4;
  const s = Math.min((cw - 60) / span, (ch - 60) / span);
  return {
    x: cw / 2 + xCm * s,
    y: 50 + depthCm * s,
    s
  };
}
function toWorld(px, py) {
  const span = Math.max(state.spkDist, state.listenerDepth, 120) * 1.4;
  const s = Math.min((cw - 60) / span, (ch - 60) / span);
  return {
    xCm: (px - cw / 2) / s,
    depthCm: (py - 50) / s
  };
}

let dragTarget = null;
dom.canvas.addEventListener('pointerdown', e => {
  const rect = dom.canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const spkL = toScreen(-state.spkDist / 2, 0);
  const spkR = toScreen(state.spkDist / 2, 0);
  const list = toScreen(state.listenerOffset, state.listenerDepth);

  if (Math.hypot(px - spkL.x, py - spkL.y) < 20) dragTarget = 'spkL';
  else if (Math.hypot(px - spkR.x, py - spkR.y) < 20) dragTarget = 'spkR';
  else if (Math.hypot(px - list.x, py - list.y) < 20) dragTarget = 'list';

  if (dragTarget) dom.canvas.setPointerCapture(e.pointerId);
});

dom.canvas.addEventListener('pointermove', e => {
  if (!dragTarget) return;
  const rect = dom.canvas.getBoundingClientRect();
  const { xCm, depthCm } = toWorld(e.clientX - rect.left, e.clientY - rect.top);
  if (dragTarget === 'spkL' || dragTarget === 'spkR') {
    syncParam('spkDist', Math.max(15, Math.min(300, Math.abs(xCm) * 2)));
  } else if (dragTarget === 'list') {
    syncParam('listenerDepth', Math.max(15, Math.min(300, depthCm)));
    syncParam('listenerOffset', Math.max(-100, Math.min(100, xCm)));
  }
});
dom.canvas.addEventListener('pointerup', () => { dragTarget = null; });

function drawStage() {
  ctx.clearRect(0, 0, cw, ch);

  const spkL = toScreen(-state.spkDist / 2, 0);
  const spkR = toScreen(state.spkDist / 2, 0);
  const list = toScreen(state.listenerOffset, state.listenerDepth);

  // Lines
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(spkL.x, spkL.y); ctx.lineTo(list.x, list.y);
  ctx.moveTo(spkR.x, spkR.y); ctx.lineTo(list.x, list.y);
  ctx.stroke();

  // Dimension line
  ctx.strokeStyle = '#000';
  ctx.setLineDash([2, 2]);
  ctx.beginPath();
  ctx.moveTo(spkL.x, spkL.y - 18); ctx.lineTo(spkR.x, spkR.y - 18);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#000';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.spkDist.toFixed(1)} cm`, (spkL.x + spkR.x) / 2, spkL.y - 22);

  // Speakers
  function drawSpk(p, angle, lbl) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.fillStyle = '#fff';
    ctx.fillRect(-12, -8, 24, 16);
    ctx.strokeRect(-12, -8, 24, 16);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#000';
    ctx.font = '10px sans-serif';
    ctx.fillText(lbl, p.x, p.y + 18);
  }
  const toeRad = (state.toeIn * Math.PI) / 180;
  drawSpk(spkL, -toeRad, 'L');
  drawSpk(spkR, toeRad, 'R');

  // Listener
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(list.x, list.y, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillText(`${state.listenerDepth.toFixed(1)} cm`, list.x, list.y + 20);

  requestAnimationFrame(drawStage);
}
requestAnimationFrame(drawStage);

function syncParam(key, val) {
  state[key] = Math.round(val * 10) / 10;
  if (key === 'spkDist') { dom.spkDist.value = state[key]; dom.spkDistN.value = state[key]; }
  if (key === 'listenerDepth') { dom.listDepth.value = state[key]; dom.listDepthN.value = state[key]; }
  if (key === 'listenerOffset') { dom.listX.value = state[key]; dom.listXN.value = state[key]; }
  if (key === 'toeIn') { dom.toein.value = state[key]; dom.toeinN.value = state[key]; }
  applyAcoustics();
}

dom.spkDist.oninput = e => syncParam('spkDist', +e.target.value);
dom.spkDistN.onchange = e => syncParam('spkDist', +e.target.value);
dom.listDepth.oninput = e => syncParam('listenerDepth', +e.target.value);
dom.listDepthN.onchange = e => syncParam('listenerDepth', +e.target.value);
dom.listX.oninput = e => syncParam('listenerOffset', +e.target.value);
dom.listXN.onchange = e => syncParam('listenerOffset', +e.target.value);
dom.toein.oninput = e => syncParam('toeIn', +e.target.value);
dom.toeinN.onchange = e => syncParam('toeIn', +e.target.value);
dom.mode.onchange = e => { state.acousticMode = e.target.value; applyAcoustics(); };

document.getElementById('p-desktop').onclick = () => { syncParam('spkDist', 52); syncParam('listenerDepth', 50); syncParam('listenerOffset', 0); syncParam('toeIn', 15); };
document.getElementById('p-studio').onclick = () => { syncParam('spkDist', 90); syncParam('listenerDepth', 90); syncParam('listenerOffset', 0); syncParam('toeIn', 30); };
document.getElementById('p-piano').onclick = () => { syncParam('spkDist', 123); syncParam('listenerDepth', 45); syncParam('listenerOffset', 0); syncParam('toeIn', 10); };

// Run-up / Run-down Sweep
async function runSweep(asc) {
  if (state.sweepActive) {
    state.sweepCancel = true;
    return;
  }
  await ensureAudio();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  state.sweepActive = true;
  state.sweepCancel = false;
  dom.runUp.textContent = asc ? 'Stop' : '▲ Run Up';
  dom.runDown.textContent = !asc ? 'Stop' : '▼ Run Down';

  const notes = asc ? [...WHITE_KEYS] : [...WHITE_KEYS].reverse();
  const stepMs = 32;

  for (let note of notes) {
    if (state.sweepCancel) break;
    synth.noteOn(0, note, 95);
    setTimeout(() => synth.noteOff(0, note), stepMs * 2);
    await new Promise(r => setTimeout(r, stepMs));
  }

  state.sweepActive = false;
  state.sweepCancel = false;
  dom.runUp.textContent = '▲ Run Up';
  dom.runDown.textContent = '▼ Run Down';
}

dom.runUp.onclick = () => runSweep(true);
dom.runDown.onclick = () => runSweep(false);

dom.sfIn.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  dom.loader.classList.add('show');
  try {
    sfBuffer = await file.arrayBuffer();
    if (synth) {
      await synth.soundBankManager.addSoundBank(sfBuffer, 'main');
      await synth.isReady;
    }
    dom.status.textContent = `SoundFont: ${file.name}`;
    updateTransport();
  } catch (err) {
    dom.status.textContent = `SF Error: ${err.message}`;
  } finally {
    dom.loader.classList.remove('show');
  }
};

dom.sfDefault.onclick = async () => {
  const url = 'https://raw.githubusercontent.com/ad-si/GeneralUser/master/GeneralUser.sf2';
  dom.loader.classList.add('show');
  dom.status.textContent = 'Downloading GeneralUser GS (~30MB)...';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    sfBuffer = await res.arrayBuffer();
    if (synth) {
      await synth.soundBankManager.addSoundBank(sfBuffer, 'main');
      await synth.isReady;
    }
    dom.status.textContent = 'SoundFont: GeneralUser GS';
    updateTransport();
  } catch (err) {
    dom.status.textContent = `Download Error: ${err.message}`;
  } finally {
    dom.loader.classList.remove('show');
  }
};

dom.midiIn.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    midiBuffer = await file.arrayBuffer();
    midiFileName = file.name;
    dom.seekWrap.classList.add('active');
    dom.seek.value = 0;
    dom.time.textContent = '0:00 / --:--';
    if (sequencer) {
      sequencer.loadNewSongList([{ binary: midiBuffer, fileName: midiFileName }]);
      if (sequencer.duration > 0) {
        duration = sequencer.duration;
        dom.time.textContent = `0:00 / ${fmtTime(duration)}`;
      }
    }
    dom.status.textContent = `MIDI: ${midiFileName}`;
    updateTransport();
  } catch (err) {
    dom.status.textContent = `MIDI Error: ${err.message}`;
  }
};

function updateTransport() {
  const hasSf = !!sfBuffer;
  const hasMidi = !!midiBuffer;
  dom.play.disabled = !(hasSf && hasMidi);
  dom.runUp.disabled = !hasSf;
  dom.runDown.disabled = !hasSf;
}

dom.play.onclick = async () => {
  if (!sfBuffer || !midiBuffer) return;
  await ensureAudio();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  if (state.isPaused && sequencer) {
    sequencer.play();
  } else {
    clearKeys();
    sequencer.loadNewSongList([{ binary: midiBuffer, fileName: midiFileName }]);
    sequencer.playbackRate = state.tempo;
    sequencer.play();
  }

  state.isPlaying = true;
  state.isPaused = false;
  dom.play.disabled = true;
  dom.pause.disabled = false;
  dom.stop.disabled = false;
  dom.status.textContent = `Playing: ${midiFileName}`;

  clearInterval(seekTimer);
  seekTimer = setInterval(() => {
    if (!sequencer) return;
    const t = sequencer.currentHighResolutionTime ?? sequencer.currentTime ?? 0;
    const d = sequencer.duration || duration;
    if (d > 0) {
      duration = d;
      dom.seek.value = Math.min(1000, (t / d) * 1000);
      dom.time.textContent = `${fmtTime(t)} / ${fmtTime(d)}`;
      if (t >= d - 0.1 || sequencer.isFinished) stopPlayback();
    }
  }, 100);
};

dom.pause.onclick = () => {
  if (!sequencer || !state.isPlaying) return;
  sequencer.pause();
  state.isPlaying = false;
  state.isPaused = true;
  dom.play.disabled = false;
  dom.pause.disabled = true;
  dom.status.textContent = 'Paused';
  clearInterval(seekTimer);
  clearKeys();
};

dom.stop.onclick = () => stopPlayback();

function stopPlayback() {
  if (sequencer) {
    sequencer.pause();
    sequencer.currentTime = 0;
  }
  clearKeys();
  state.isPlaying = false;
  state.isPaused = false;
  dom.play.disabled = !(sfBuffer && midiBuffer);
  dom.pause.disabled = true;
  dom.stop.disabled = true;
  dom.status.textContent = midiFileName ? `Stopped: ${midiFileName}` : 'Stopped';
  dom.seek.value = 0;
  dom.time.textContent = `0:00 / ${fmtTime(duration)}`;
  clearInterval(seekTimer);
}

dom.seek.oninput = () => {
  if (!sequencer || duration <= 0) return;
  const t = (parseFloat(dom.seek.value) / 1000) * duration;
  sequencer.currentTime = t;
  dom.time.textContent = `${fmtTime(t)} / ${fmtTime(duration)}`;
  clearKeys();
};

dom.vol.oninput = e => {
  state.vol = parseFloat(e.target.value) / 100;
  dom.volTxt.textContent = `${e.target.value}%`;
  if (masterGain && audioCtx) {
    masterGain.gain.setTargetAtTime(state.vol, audioCtx.currentTime, 0.03);
  }
};

dom.tempo.oninput = e => {
  state.tempo = parseFloat(e.target.value) / 100;
  dom.tempoTxt.textContent = `${e.target.value}%`;
  if (sequencer) sequencer.playbackRate = state.tempo;
};

function fmtTime(sec) {
  if (!isFinite(sec) || sec <= 0) return '0:00';
  const s = Math.floor(sec);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
</script>
</body>
</html>
