<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Crosshatch Converter</title>

    <!-- フォントの読み込み・書き出し -->
    <script src="https://unpkg.com/opentype.js@2.0.0/dist/opentype.js"></script>
    <!-- 輪郭どうしの交差計算（文字 ∩ 斜線）に使用（メインとWorkerの両方で利用） -->
    <script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.min.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea { height: 60px; resize: vertical; }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0077ed; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #error-msg {
            color: #ff3b30;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
        #font-info, #progress { margin-top: 8px; font-size: 14px; color: #555; word-break: break-all; }
        #download-link {
            display: inline-block;
            background: #34c759;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        #preview {
            margin-top: 20px;
            font-size: 96px;
            line-height: 1.2;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #fff;
        }
        #preview-note { font-size: 13px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>Font Crosshatch Converter</h1>
    <div id="error-msg"></div>

    <p>
        フォント（OTF/TTF）を読み込み、JIS第一水準漢字・ひらがな・カタカナ・記号のグリフだけを
        「上部100%〜下部20%」の密度のクロスハッチに変換して、新しい OTF として書き出します。
    </p>

    <div class="card">
        <div class="control-group">
            <label for="font-file">1. フォントファイルを選択 (.otf / .ttf)</label>
            <input type="file" id="font-file" accept=".otf,.ttf">
            <div id="font-info"></div>
        </div>

        <div class="control-group">
            <label for="extra-chars">2. 追加で変換したい文字（任意）</label>
            <textarea id="extra-chars" placeholder="例: ※★"></textarea>
        </div>

        <button id="convert-btn" disabled>ライブラリ準備中...</button>
        <div id="progress"></div>
    </div>

    <div class="card" id="result-card" style="display:none;">
        <a id="download-link" href="#" download>OTFをダウンロード</a>
        <div id="preview">亜あア①克ロ</div>
        <div id="preview-note"></div>
    </div>

<script>
// ===== 設定 =====
const SCALE = 10;                              // Clipper は整数座標が必要なので小数を保つため拡大
const PITCH_DIVISOR = 20;                      // 斜線の間隔 = UPM / PITCH_DIVISOR（小さいほど粗く軽い）
const Q_STEPS = 4;                             // 2次曲線の分割数
const C_STEPS = 6;                             // 3次曲線の分割数
const CUT_TAIL_CHARS = 100;                    // 自動生成された対象文字の末尾からこの数だけ除外する
const GLYPH_TIMEOUT_MS = 3000;                 // 1グリフの交差計算の上限時間。超えたら打ち切る
const PREVIEW_MAX_BYTES = 15 * 1024 * 1024;    // これより大きい場合はプレビューを省略
const PROGRESS_EVERY = 500;                    // 進捗表示の間隔（グリフ数）

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

let loadedFont = null;
let loadedName = 'font';

// ===== 起動時チェック =====
window.addEventListener('DOMContentLoaded', () => {
    const btn = $('convert-btn');
    if (typeof opentype !== 'undefined' && typeof ClipperLib !== 'undefined') {
        btn.innerText = '変換してOTFを作成';
    } else {
        $('error-msg').style.display = 'block';
        $('error-msg').innerText = '⚠️ 外部ライブラリの読み込みに失敗しました。ネット接続を確認して再読み込みしてください。';
        btn.innerText = '利用不可（エラー）';
    }
});

// ===== 対象文字の自動生成（Shift_JIS の行構成を利用） =====
// リードバイト 0x88〜0x9F = JIS X 0208 第一水準漢字（16〜47区）
// 0x81 = 記号、0x82 = 全角英数・ひらがな、0x83 = カタカナ
// 挿入順は「記号・かな → 漢字」なので、末尾の除外は主に漢字の後ろの方が対象になる
function buildTargetChars() {
    const dec = new TextDecoder('shift_jis');
    const leads = [0x81, 0x82, 0x83];
    for (let l = 0x88; l <= 0x9F; l++) leads.push(l);

    const chars = new Set();
    for (const lead of leads) {
        for (let trail = 0x40; trail <= 0xFC; trail++) {
            if (trail === 0x7F) continue;
            const s = dec.decode(new Uint8Array([lead, trail]));
            if (s.length !== 1 || s === '\uFFFD') continue;

            const cp = s.codePointAt(0);
            const isKanji  = lead >= 0x88 && cp >= 0x4E00 && cp <= 0x9FFF;
            const isKana   = (cp >= 0x3041 && cp <= 0x3093) || (cp >= 0x30A1 && cp <= 0x30F6);
            const isSymbol = lead === 0x81 || (cp >= 0xFF01 && cp <= 0xFF5E);
            if (isKanji || isKana || isSymbol) chars.add(s);
        }
    }
    return chars;
}

// ===== メインスレッド側の幾何ユーティリティ（3次曲線の直線化用） =====
function pathToRings(commands) {
    const rings = [];
    let cur = null;
    let cx = 0, cy = 0, sx = 0, sy = 0;

    for (const c of commands) {
        if (c.type === 'M') {
            cur = [{ x: c.x, y: c.y }];
            rings.push(cur);
            cx = sx = c.x; cy = sy = c.y;
        } else if (c.type === 'L') {
            if (!cur) continue;
            cur.push({ x: c.x, y: c.y });
            cx = c.x; cy = c.y;
        } else if (c.type === 'Q') {
            if (!cur) continue;
            for (let k = 1; k <= Q_STEPS; k++) {
                const t = k / Q_STEPS, mt = 1 - t;
                cur.push({
                    x: mt * mt * cx + 2 * mt * t * c.x1 + t * t * c.x,
                    y: mt * mt * cy + 2 * mt * t * c.y1 + t * t * c.y
                });
            }
            cx = c.x; cy = c.y;
        } else if (c.type === 'C') {
            if (!cur) continue;
            for (let k = 1; k <= C_STEPS; k++) {
                const t = k / C_STEPS, mt = 1 - t;
                const a = mt * mt * mt, b = 3 * mt * mt * t, d = 3 * mt * t * t, e = t * t * t;
                cur.push({
                    x: a * cx + b * c.x1 + d * c.x2 + e * c.x,
                    y: a * cy + b * c.y1 + d * c.y2 + e * c.y
                });
            }
            cx = c.x; cy = c.y;
        } else if (c.type === 'Z') {
            cx = sx; cy = sy;
        }
    }
    return rings.filter(r => r.length >= 3);
}

// 3次曲線（C）を含むグリフだけ直線化する。それ以外は元のパスをそのまま返す
function flattenPath(path) {
    if (!path.commands.some(c => c.type === 'C')) return path;
    const out = new opentype.Path();
    for (const ring of pathToRings(path.commands)) {
        ring.forEach((p, i) => (i === 0 ? out.moveTo(p.x, p.y) : out.lineTo(p.x, p.y)));
        out.close();
    }
    return out;
}

// ===== 斜線の生成（全グリフ共通なので一度だけ作る） =====
// 目標カバー率 C は上端 1.0、下端 0.2 に線形変化。
// 斜線は2方向を重ねるので、1方向あたりの被覆率 c は 1 - (1 - c)^2 = C を満たすように決める。
function buildHatchItems(font) {
    const upm = font.unitsPerEm;
    const yTop = font.ascender;
    const yBot = font.descender;
    const pitch = upm / PITCH_DIVISOR;
    const cx = upm / 2;
    const cy = (yTop + yBot) / 2;
    const L = upm * 1.2;
    const K = Math.ceil(L / pitch) + 2;
    const STEPS = 8;

    const coverageAt = y => {
        const t = clamp((yTop - y) / (yTop - yBot), 0, 1); // 上=0, 下=1
        const C = 1 - 0.8 * t;                              // 1.0 → 0.2
        return 1 - Math.sqrt(1 - C);
    };

    const items = [];
    for (const ang of [Math.PI / 4, -Math.PI / 4]) {
        const u = { x: Math.cos(ang), y: Math.sin(ang) };
        const n = { x: -u.y, y: u.x };

        for (let k = -K; k <= K; k++) {
            const bx = cx + n.x * k * pitch;
            const by = cy + n.y * k * pitch;
            const left = [], right = [];

            for (let j = 0; j <= STEPS; j++) {
                const s = -L + (2 * L) * j / STEPS;
                const px = bx + u.x * s;
                const py = by + u.y * s;
                const h = pitch * coverageAt(py) / 2;
                left.push({ x: px + n.x * h, y: py + n.y * h });
                right.push({ x: px - n.x * h, y: py - n.y * h });
            }
            const pts = left.concat(right.reverse());

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of pts) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
            items.push({
                poly: pts.map(p => ({ X: Math.round(p.x * SCALE), Y: Math.round(p.y * SCALE) })),
                minX, minY, maxX, maxY
            });
        }
    }
    return items;
}

// ===== Worker（交差計算を別スレッドで実行し、固まったら打ち切る） =====
const WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.min.js');

const SCALE = ${SCALE};
const Q_STEPS = ${Q_STEPS};
const C_STEPS = ${C_STEPS};
let HATCH = [];

function pathToRings(commands) {
    const rings = [];
    let cur = null;
    let cx = 0, cy = 0, sx = 0, sy = 0;
    for (const c of commands) {
        if (c.type === 'M') {
            cur = [{ x: c.x, y: c.y }];
            rings.push(cur);
            cx = sx = c.x; cy = sy = c.y;
        } else if (c.type === 'L') {
            if (!cur) continue;
            cur.push({ x: c.x, y: c.y });
            cx = c.x; cy = c.y;
        } else if (c.type === 'Q') {
            if (!cur) continue;
            for (let k = 1; k <= Q_STEPS; k++) {
                const t = k / Q_STEPS, mt = 1 - t;
                cur.push({
                    x: mt * mt * cx + 2 * mt * t * c.x1 + t * t * c.x,
                    y: mt * mt * cy + 2 * mt * t * c.y1 + t * t * c.y
                });
            }
            cx = c.x; cy = c.y;
        } else if (c.type === 'C') {
            if (!cur) continue;
            for (let k = 1; k <= C_STEPS; k++) {
                const t = k / C_STEPS, mt = 1 - t;
                const a = mt * mt * mt, b = 3 * mt * mt * t, d = 3 * mt * t * t, e = t * t * t;
                cur.push({
                    x: a * cx + b * c.x1 + d * c.x2 + e * c.x,
                    y: a * cy + b * c.y1 + d * c.y2 + e * c.y
                });
            }
            cx = c.x; cy = c.y;
        } else if (c.type === 'Z') {
            cx = sx; cy = sy;
        }
    }
    return rings.filter(r => r.length >= 3);
}

function hatchGlyph(commands) {
    const rings = pathToRings(commands);
    if (rings.length === 0) return [];

    let gx1 = Infinity, gy1 = Infinity, gx2 = -Infinity, gy2 = -Infinity;
    for (const r of rings) for (const p of r) {
        if (p.x < gx1) gx1 = p.x;
        if (p.x > gx2) gx2 = p.x;
        if (p.y < gy1) gy1 = p.y;
        if (p.y > gy2) gy2 = p.y;
    }

    const clip = [];
    for (const it of HATCH) {
        if (it.maxX >= gx1 && it.minX <= gx2 && it.maxY >= gy1 && it.minY <= gy2) clip.push(it.poly);
    }
    if (clip.length === 0) return [];

    const subj = rings.map(r => r.map(p => ({ X: Math.round(p.x * SCALE), Y: Math.round(p.y * SCALE) })));
    const cpr = new ClipperLib.Clipper();
    cpr.AddPaths(subj, ClipperLib.PolyType.ptSubject, true);
    cpr.AddPaths(clip, ClipperLib.PolyType.ptClip, true);

    const sol = [];
    cpr.Execute(
        ClipperLib.ClipType.ctIntersection,
        sol,
        ClipperLib.PolyFillType.pftNonZero,
        ClipperLib.PolyFillType.pftNonZero
    );
    return sol.filter(p => p.length >= 3).map(p => p.map(q => [q.X / SCALE, q.Y / SCALE]));
}

self.onmessage = e => {
    const m = e.data;
    if (m.type === 'init') {
        HATCH = m.items;
        self.postMessage({ type: 'ready' });
    } else if (m.type === 'glyph') {
        try {
            self.postMessage({ type: 'done', id: m.id, polys: hatchGlyph(m.commands) });
        } catch (err) {
            self.postMessage({ type: 'error', id: m.id, msg: String(err && err.message || err) });
        }
    }
};
`;

const WORKER_URL = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'application/javascript' }));

// Worker を作り、斜線データを渡して準備完了を待つ
function makeHatchWorker(items) {
    return new Promise((resolve, reject) => {
        const w = new Worker(WORKER_URL);
        w.onerror = () => { w.terminate(); reject(new Error('Worker の起動に失敗しました（clipper の読み込みを確認してください）')); };
        w.onmessage = e => {
            if (e.data.type === 'ready') resolve(w);
        };
        w.postMessage({ type: 'init', items });
    });
}

// 1グリフ分の交差計算を依頼。時間内に返らなければ reject する
function runGlyph(worker, id, commands) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('タイムアウト')), GLYPH_TIMEOUT_MS);
        worker.onerror = () => { clearTimeout(timer); reject(new Error('Worker エラー')); };
        worker.onmessage = e => {
            clearTimeout(timer);
            if (e.data.type === 'done') resolve(e.data.polys);
            else reject(new Error(e.data.msg));
        };
        worker.postMessage({ type: 'glyph', id, commands });
    });
}

// 返ってきたポリゴン群を opentype.Path にする
function polysToPath(polys) {
    const out = new opentype.Path();
    for (const poly of polys) {
        out.moveTo(poly[0][0], poly[0][1]);
        for (let i = 1; i < poly.length; i++) out.lineTo(poly[i][0], poly[i][1]);
        out.close();
    }
    return out;
}

function makeGlyph(g, path) {
    return new opentype.Glyph({
        name: g.name,
        unicode: g.unicode,
        unicodes: g.unicodes,
        advanceWidth: g.advanceWidth,
        path: path
    });
}

// ===== フォント読み込み =====
$('font-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
        const buf = await file.arrayBuffer();
        loadedFont = opentype.parse(buf);
        loadedName = file.name.replace(/\.(otf|ttf)$/i, '');
        $('font-info').innerText = `読み込み成功: ${loadedFont.numGlyphs} グリフ / UPM ${loadedFont.unitsPerEm}`;
        $('convert-btn').disabled = false;
    } catch (err) {
        loadedFont = null;
        $('convert-btn').disabled = true;
        alert('フォントの解析に失敗しました: ' + err.message);
    }
});

// ===== 変換 → OTF出力 =====
$('convert-btn').addEventListener('click', async () => {
    if (!loadedFont) {
        alert('先にフォントファイルを読み込んでください。');
        return;
    }

    const btn = $('convert-btn');
    btn.disabled = true;
    $('result-card').style.display = 'none';
    const font = loadedFont;
    const failed = [];
    let worker = null;

    try {
        // 対象文字：自動生成から末尾 CUT_TAIL_CHARS 文字を除外し、追加文字を足す
        const autoChars = [...buildTargetChars()];
        const kept = autoChars.slice(0, Math.max(0, autoChars.length - CUT_TAIL_CHARS));
        const targetChars = new Set(kept);
        for (const ch of $('extra-chars').value) targetChars.add(ch);

        const targetIds = new Set();
        for (const ch of targetChars) {
            const gi = font.charToGlyphIndex(ch);
            if (gi > 0) targetIds.add(gi);
        }

        const hatchItems = buildHatchItems(font);
        worker = await makeHatchWorker(hatchItems);

        const n = font.numGlyphs;
        const newGlyphs = new Array(n);

        for (let i = 0; i < n; i++) {
            const g = font.glyphs.get(i);
            const src = g.path || new opentype.Path();

            if (!targetIds.has(i)) {
                // 対象外：3次曲線を含むものだけ直線化、それ以外は元のグリフを再利用
                const p = flattenPath(src);
                newGlyphs[i] = (p === src) ? g : makeGlyph(g, p);
            } else {
                try {
                    const polys = await runGlyph(worker, i, src.commands);
                    newGlyphs[i] = makeGlyph(g, polysToPath(polys));
                } catch (err) {
                    // 固まった・失敗したグリフは元の形で残し、Worker を作り直す
                    failed.push(`${i}(${g.unicode ? 'U+' + g.unicode.toString(16).toUpperCase() : g.name})`);
                    try { worker.terminate(); } catch (_) {}
                    worker = await makeHatchWorker(hatchItems);
                    newGlyphs[i] = makeGlyph(g, flattenPath(src));
                }
            }

            if (i % PROGRESS_EVERY === 0) {
                $('progress').innerText = `変換中… ${i} / ${n}（対象 ${targetIds.size} 文字）`;
                await sleep(0);
            }
        }

        try { worker.terminate(); } catch (_) {}
        worker = null;

        $('progress').innerText = '出力ファイルを作成中…';
        await sleep(0);

        const outFont = new opentype.Font({
            familyName: loadedName + ' Crosshatch',
            styleName: 'Regular',
            unitsPerEm: font.unitsPerEm,
            ascender: font.ascender,
            descender: font.descender,
            glyphs: newGlyphs
        });

        let outBuf;
        try {
            outBuf = outFont.toArrayBuffer();
        } catch (err) {
            throw new Error(
                '出力の生成に失敗しました（メモリ不足の可能性が高いです）。' +
                'PITCH_DIVISOR を小さく（例: 20 → 14）してください。 詳細: ' + err.message
            );
        }

        const sizeMB = (outBuf.byteLength / 1024 / 1024).toFixed(1);

        // ダウンロードリンク
        const blob = new Blob([outBuf], { type: 'font/otf' });
        const link = $('download-link');
        if (link.href.startsWith('blob:')) URL.revokeObjectURL(link.href);
        link.href = URL.createObjectURL(blob);
        link.download = loadedName + '_crosshatch.otf';

        // プレビュー（大きい場合は省略）
        if (outBuf.byteLength <= PREVIEW_MAX_BYTES) {
            try {
                const ff = new FontFace('CrosshatchPreview', outBuf);
                await ff.load();
                document.fonts.add(ff);
                $('preview').style.fontFamily = "'CrosshatchPreview', sans-serif";
                $('preview-note').innerText = '';
            } catch (_) {
                $('preview-note').innerText = 'プレビューの表示に失敗しました（ダウンロードは可能です）';
            }
        } else {
            $('preview').style.fontFamily = 'sans-serif';
            $('preview-note').innerText = `ファイルが大きいため（${sizeMB} MB）プレビューは省略しました`;
        }

        $('result-card').style.display = 'block';
        let msg = `完了: ${targetIds.size} 文字を変換しました（${sizeMB} MB）。`;
        if (failed.length > 0) {
            const shown = failed.slice(0, 30).join(', ');
            msg += ` 時間切れ・失敗で元の形のまま残したグリフ（${failed.length}件）: ${shown}${failed.length > 30 ? ' ほか' + (failed.length - 30) + '件' : ''}`;
        }
        $('progress').innerText = msg;
    } catch (err) {
        console.error(err);
        alert('変換中にエラーが発生しました: ' + err.message);
        $('progress').innerText = '';
    } finally {
        if (worker) { try { worker.terminate(); } catch (_) {} }
        btn.disabled = false;
    }
});
</script>
</body>
</html>
