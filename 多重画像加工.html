<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>多重画像加工</title>
<style>
:root{--bg:#fff;--fg:#000;--mid:#ddd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;padding:20px}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px}
.app>header{grid-column:1/-1}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--fg);padding:12px 14px;background:var(--bg)}
.ph{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;margin-bottom:8px}
h1{font-size:16px}
.note{font-size:12px;margin-top:4px}
input,select,textarea,button{background:var(--bg);color:var(--fg);border:1px solid var(--fg);font:inherit;font-size:12px}
button{padding:4px 10px;cursor:pointer;font-weight:600}
button.s{background:var(--fg);color:var(--bg)}
@media(hover:hover){button:hover{background:var(--fg);color:var(--bg)}button.s:hover{background:var(--bg);color:var(--fg)}}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
select,input[type=number]{padding:3px 5px}
textarea{width:100%;padding:6px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px}
.view{position:sticky;top:12px;align-self:start}
@media(max-width:860px){.view{position:static}}
.cvw{border:1px solid var(--fg);display:flex;justify-content:center;overflow:hidden}
canvas{max-width:100%;max-height:70vh;width:auto;height:auto;display:block}
.L{border:1px solid var(--fg);margin-top:8px}
.L.off .lb{opacity:.4}
.lh{display:flex;gap:4px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--fg);flex-wrap:wrap}
.lh b{flex:1;min-width:90px}
.lb{padding:6px 8px}
.p{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:6px;align-items:center;padding:2px 0;border-bottom:1px solid var(--mid)}
.p input[type=range]{width:100%;accent-color:var(--fg)}
.p input[type=number]{width:62px}
.p input[type=color]{width:62px;height:22px;padding:0}
</style>
</head>
<body>
<div class="app">
<header class="panel">
  <div class="ph"><span>IMAGE PROCESSING STACK</span><span>MULTI-LAYER PROCESSOR</span></div>
  <h1>多重画像加工</h1>
  <p class="note">画像を読み込み、加工を好きなだけ積む。各レイヤーに不透明度・合成モード・数値パラメータあり。上から順に適用。処理はすべてブラウザ内で完結します。</p>
</header>

<section class="panel view">
  <div class="ph"><span></span><span id="info"></span></div>
  <div class="cvw"><p id="empty" style="padding:90px 12px;font-weight:700;text-align:center">画像を選択、またはここにドロップ</p><canvas id="cv" style="display:none"></canvas></div>
  <div class="row">
    <input type="file" id="file" accept="image/*">
    <label>処理サイズ <select id="res"><option>480</option><option selected>800</option><option>1200</option><option>2000</option></select></label>
  </div>
  <div class="row">
    <button type="button" id="cmp" title="押している間だけ元画像を表示">元画像を見る(押下)</button>
    <button type="button" id="save" class="s">PNG保存</button>
    <span id="msg" style="font-weight:700"></span>
  </div>
  <p class="note">保存が動かない環境では、画像を右クリック/長押しで保存できます。</p>
</section>

<section class="panel">
  <div class="ph"><span>PROCESSING LAYERS</span><span id="cnt">0</span></div>
  <div class="row" style="margin-top:0">
    <select id="add"></select>
    <button type="button" id="addb" class="s">+ 追加</button>
    <button type="button" id="rall">全ランダム</button>
    <button type="button" id="clr">全削除</button>
  </div>
  <div id="st"></div>
  <div class="row">
    <button type="button" id="jx">JSON書き出し</button>
    <button type="button" id="ji">JSON読み込み</button>
  </div>
  <textarea id="js" rows="3" placeholder="レイヤー構成のJSON (保存・共有用)"></textarea>
</section>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cl=function(x){return x<0?0:x>255?255:x};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(c){var n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255]}
function lum(d,i){return .299*d[i]+.587*d[i+1]+.114*d[i+2]}
function bl(s,t,w,h,r,hor){var n=hor?w:h,st=hor?4:w*4,ln=hor?h:w,ls=hor?w*4:4;
  for(var l=0;l<ln;l++){var o=l*ls;for(var c=0;c<4;c++){var sum=0,cnt=0,i;
    for(i=0;i<=r&&i<n;i++){sum+=s[o+i*st+c];cnt++}
    for(i=0;i<n;i++){t[o+i*st+c]=sum/cnt;var a=i+r+1,b=i-r;if(a<n){sum+=s[o+a*st+c];cnt++}if(b>=0){sum-=s[o+b*st+c];cnt--}}}}}
function blur(d,w,h,r,k){if(r<1)return;var t=new Uint8ClampedArray(d.length);for(var j=0;j<k;j++){bl(d,t,w,h,r,1);bl(t,d,w,h,r,0)}}
function ss(a,b,x){var t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}

/* param: [key,label,min,max,step,default] / color: [key,label,"c",default] */
function chn(i,nm){return{g:"色",n:nm,p:[["v","強さ %",0,300,1,100]],fn:function(d,w,h,q){for(var k=i;k<d.length;k+=4)d[k]*=q.v/100}}}
function nz(mono){return function(d,w,h,q){var R=rng(7),a=q.a*2.55;for(var i=0;i<d.length;i+=4){if(mono){var n=(R()-.5)*a;d[i]+=n;d[i+1]+=n;d[i+2]+=n}else{d[i]+=(R()-.5)*a;d[i+1]+=(R()-.5)*a;d[i+2]+=(R()-.5)*a}}}}
function sat1(d,k,vib,tp,ti){for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2],l=lum(d,i),sc=(Math.max(r,g,b)-Math.min(r,g,b))/255,m=k+vib*(1-sc);
  d[i]=l+(r-l)*m+tp*.6;d[i+1]=l+(g-l)*m-ti*.6;d[i+2]=l+(b-l)*m-tp*.6}}
function wv(d,w,h,ax,fy,ay,fx){var c=d.slice(),T=Math.PI*2;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var sx=Math.round(x+ax*Math.sin(T*(y/h*fy))),sy=Math.round(y+ay*Math.sin(T*(x/w*fx)));
  sx=Math.max(0,Math.min(w-1,sx));sy=Math.max(0,Math.min(h-1,sy));var i=(y*w+x)*4,j=(sy*w+sx)*4;d[i]=c[j];d[i+1]=c[j+1];d[i+2]=c[j+2]}}
var E={
br:{g:"色",n:"明るさ",p:[["v","明るさ",-100,100,1,0]],fn:function(d,w,h,q){for(var i=0;i<d.length;i++)if((i&3)!==3)d[i]+=q.v*2.55}},
ct:{g:"色",n:"コントラスト",p:[["v","コントラスト",-100,100,1,0]],fn:function(d,w,h,q){var f=q.v>0?1+q.v/50:1+q.v/100;for(var i=0;i<d.length;i++)if((i&3)!==3)d[i]=(d[i]-128)*f+128}},
ex:{g:"色",n:"露出",p:[["v","露出 EV",-3,3,.05,0]],fn:function(d,w,h,q){var f=Math.pow(2,q.v);for(var i=0;i<d.length;i++)if((i&3)!==3)d[i]*=f}},
gm:{g:"色",n:"ガンマ",p:[["v","ガンマ",.2,3,.01,1]],fn:function(d,w,h,q){var t=[],i;for(i=0;i<256;i++)t[i]=255*Math.pow(i/255,1/q.v);for(i=0;i<d.length;i++)if((i&3)!==3)d[i]=t[Math.round(cl(d[i]))]}},
sat:{g:"色",n:"彩度",p:[["v","彩度",-100,100,1,30]],fn:function(d,w,h,q){sat1(d,1+q.v/100,0,0,0)}},
vib:{g:"色",n:"自然な彩度",p:[["v","自然な彩度",-100,100,1,40]],fn:function(d,w,h,q){sat1(d,1,q.v/100,0,0)}},
hue:{g:"色",n:"色相回転",p:[["v","角度",-180,180,1,30]],fn:function(d,w,h,q){var a=q.v*Math.PI/180,c=Math.cos(a),s=Math.sin(a),
  m=[.213+c*.787-s*.213,.715-c*.715-s*.715,.072-c*.072+s*.928,.213-c*.213+s*.143,.715+c*.285+s*.14,.072-c*.072-s*.283,.213-c*.213-s*.787,.715-c*.715+s*.715,.072+c*.928+s*.072];
  for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2];d[i]=m[0]*r+m[1]*g+m[2]*b;d[i+1]=m[3]*r+m[4]*g+m[5]*b;d[i+2]=m[6]*r+m[7]*g+m[8]*b}}},
tp:{g:"色",n:"色温度",p:[["v","暖色 ← → 寒色",-100,100,1,0]],fn:function(d,w,h,q){sat1(d,1,0,-q.v,0)}},
ti:{g:"色",n:"色かぶり",p:[["v","緑 ← → マゼンタ",-100,100,1,0]],fn:function(d,w,h,q){sat1(d,1,0,0,q.v)}},
cr:chn(0,"赤の強さ"),cg:chn(1,"緑の強さ"),cb:chn(2,"青の強さ"),
sw:{g:"色",n:"チャンネル入替",p:[["v","パターン(0〜5)",0,5,1,1]],fn:function(d,w,h,q){var P=[[0,1,2],[2,0,1],[1,2,0],[0,2,1],[2,1,0],[1,0,2]][q.v];for(var i=0;i<d.length;i+=4){var s=[d[i],d[i+1],d[i+2]];d[i]=s[P[0]];d[i+1]=s[P[1]];d[i+2]=s[P[2]]}}},
mono:{g:"色",n:"白黒",p:[],fn:function(d){for(var i=0;i<d.length;i+=4){var l=lum(d,i);d[i]=d[i+1]=d[i+2]=l}}},
sepia:{g:"色",n:"セピア",p:[],fn:function(d){for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2];d[i]=.393*r+.769*g+.189*b;d[i+1]=.349*r+.686*g+.168*b;d[i+2]=.272*r+.534*g+.131*b}}},
inv:{g:"色",n:"反転",p:[],fn:function(d){for(var i=0;i<d.length;i++)if((i&3)!==3)d[i]=255-d[i]}},
post:{g:"色",n:"ポスタリゼーション",p:[["n","階調数",2,16,1,4]],fn:function(d,w,h,q){var n=q.n-1;for(var i=0;i<d.length;i++)if((i&3)!==3)d[i]=Math.round(d[i]/255*n)/n*255}},
duo:{g:"色",n:"2色化",p:[["th","しきい値",0,255,1,128],["c1","暗部の色","c","#10105a"],["c2","明部の色","c","#ffd24a"]],
 fn:function(d,w,h,q){var a=hx(q.c1),b=hx(q.c2),th=q.th/255;for(var i=0;i<d.length;i+=4){var t=ss(th-.08,th+.08,lum(d,i)/255);for(var k=0;k<3;k++)d[i+k]=a[k]+(b[k]-a[k])*t}}},
blur:{g:"ぼかし・シャープ",n:"ぼかし",p:[["r","半径",0,40,1,4]],fn:function(d,w,h,q){blur(d,w,h,q.r,2)}},
sharp:{g:"ぼかし・シャープ",n:"シャープ",p:[["a","量",0,6,.05,1.5]],fn:function(d,w,h,q){var b=d.slice();blur(b,w,h,2,2);for(var i=0;i<d.length;i++)if((i&3)!==3)d[i]=d[i]+(d[i]-b[i])*q.a}},
noise:{g:"質感",n:"ノイズ(カラー)",p:[["a","量",0,100,1,25]],fn:nz(0)},
mnoise:{g:"質感",n:"ノイズ(モノクロ)",p:[["a","量",0,100,1,25]],fn:nz(1)},
pix:{g:"質感",n:"モザイク",p:[["s","ブロックサイズ",1,80,1,10]],
 fn:function(d,w,h,q){var c=d.slice(),s=q.s;for(var y=0;y<h;y++){var sy=Math.min(h-1,Math.floor(y/s)*s+(s>>1));for(var x=0;x<w;x++){var sx=Math.min(w-1,Math.floor(x/s)*s+(s>>1)),i=(y*w+x)*4,j=(sy*w+sx)*4;d[i]=c[j];d[i+1]=c[j+1];d[i+2]=c[j+2]}}}},
scan:{g:"質感",n:"走査線",p:[["g","間隔",2,30,1,4],["st","濃さ %",0,100,1,40]],
 fn:function(d,w,h,q){var f=1-q.st/100,t=Math.max(1,Math.round(q.g/4));for(var y=0;y<h;y++)if(y%q.g<t)for(var x=0;x<w;x++){var i=(y*w+x)*4;d[i]*=f;d[i+1]*=f;d[i+2]*=f}}},
wx:{g:"ゆがみ",n:"横波",p:[["a","幅",0,80,1,10],["f","周期数",0,30,.1,4]],fn:function(d,w,h,q){wv(d,w,h,q.a,q.f,0,0)}},
wy:{g:"ゆがみ",n:"縦波",p:[["a","幅",0,80,1,10],["f","周期数",0,30,.1,4]],fn:function(d,w,h,q){wv(d,w,h,0,0,q.a,q.f)}},
rgb:{g:"ゆがみ",n:"RGBずらし",p:[["v","ずれ量",-60,60,1,6]],
 fn:function(d,w,h,q){var c=d.slice(),v=q.v;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var i=(y*w+x)*4,a=Math.max(0,Math.min(w-1,x-v)),b=Math.max(0,Math.min(w-1,x+v));d[i]=c[(y*w+a)*4];d[i+2]=c[(y*w+b)*4+2]}}},
glit:{g:"ゆがみ",n:"グリッチ帯",p:[["n","本数",1,80,1,12],["sh","最大ずれ",0,400,1,60]],
 fn:function(d,w,h,q){var c=d.slice(),R=rng(3);for(var k=0;k<q.n;k++){var y0=Math.floor(R()*h),hh=1+Math.floor(R()*24),sh=Math.floor((R()-.5)*2*q.sh);
  for(var y=y0;y<Math.min(h,y0+hh);y++)for(var x=0;x<w;x++){var sx=((x-sh)%w+w)%w,i=(y*w+x)*4,j=(y*w+sx)*4;d[i]=c[j];d[i+1]=c[j+1];d[i+2]=c[j+2]}}}},
vig:{g:"光・ふち",n:"ビネット",p:[["a","強さ(負で白)",-100,100,1,60]],
 fn:function(d,w,h,q){var A=Math.abs(q.a)/100;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var dx=x/w-.5,dy=y/h-.5,t=ss(.4,.9,Math.sqrt(dx*dx+dy*dy)/.707)*A,i=(y*w+x)*4;for(var k=0;k<3;k++)d[i+k]=q.a>0?d[i+k]*(1-t):d[i+k]+(255-d[i+k])*t}}},
bloom:{g:"光・ふち",n:"ブルーム(発光)",p:[["th","明るさしきい値",0,255,1,170],["in","強さ %",0,300,1,100]],
 fn:function(d,w,h,q){var b=d.slice(),i;for(i=0;i<b.length;i+=4)if(lum(b,i)<q.th)b[i]=b[i+1]=b[i+2]=0;blur(b,w,h,12,2);for(i=0;i<d.length;i++)if((i&3)!==3)d[i]+=b[i]*q.in/100}},
edge:{g:"光・ふち",n:"輪郭抽出",p:[["g","ゲイン",.1,8,.1,1.5]],
 fn:function(d,w,h,q){var L=new Float32Array(w*h),o=function(x,y){return L[y*w+x]},i;for(i=0;i<w*h;i++)L[i]=lum(d,i*4);
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){var v=0;if(x>0&&y>0&&x<w-1&&y<h-1){var gx=-o(x-1,y-1)-2*o(x-1,y)-o(x-1,y+1)+o(x+1,y-1)+2*o(x+1,y)+o(x+1,y+1),gy=-o(x-1,y-1)-2*o(x,y-1)-o(x+1,y-1)+o(x-1,y+1)+2*o(x,y+1)+o(x+1,y+1);v=Math.min(255,Math.sqrt(gx*gx+gy*gy)*q.g)}
   i=(y*w+x)*4;d[i]=d[i+1]=d[i+2]=v}}}
};


var BM={normal:function(a,b){return b},multiply:function(a,b){return a*b/255},screen:function(a,b){return 255-(255-a)*(255-b)/255},
 overlay:function(a,b){return a<128?2*a*b/255:255-2*(255-a)*(255-b)/255},add:function(a,b){return a+b},diff:function(a,b){return Math.abs(a-b)},
 lighten:function(a,b){return Math.max(a,b)},darken:function(a,b){return Math.min(a,b)}};
var BN={normal:"通常",multiply:"乗算",screen:"スクリーン",overlay:"オーバーレイ",add:"加算",diff:"差の絶対値",lighten:"比較(明)",darken:"比較(暗)"};

var layers=[],base,W=0,H=0,sched=0,showOrig=0,src,cv=$("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});

function el(t,a,c){var e=document.createElement(t),k;for(k in a)e[k]=a[k];(c||[]).forEach(function(x){e.appendChild(typeof x==="string"?document.createTextNode(x):x)});return e}
function btn(t,title,fn,cls){var b=el("button",{type:"button",textContent:t,title:title||"",className:cls||""});b.addEventListener("click",fn);return b}
function say(t){$("msg").textContent=t;setTimeout(function(){$("msg").textContent=""},2000)}
function go(){if(!sched){sched=1;requestAnimationFrame(function(){sched=0;render()})}}
function mk(t){var v={};E[t].p.forEach(function(p){v[p[0]]=p[2]==="c"?p[3]:p[5]});return{t:t,on:1,o:100,m:"normal",v:v}}
function rnd(L){E[L.t].p.forEach(function(p){if(p[2]==="c"){L.v[p[0]]="#"+("00000"+Math.floor(Math.random()*16777215).toString(16)).slice(-6)}
  else{var st=p[4],n=Math.round((p[3]-p[2])/st);L.v[p[0]]=+(p[2]+Math.floor(Math.random()*(n+1))*st).toFixed(3)}});L.o=40+Math.floor(Math.random()*61)}

function slider(label,min,max,step,val,fn){
  var r=el("input",{type:"range",min:min,max:max,step:step,value:val}),n=el("input",{type:"number",min:min,max:max,step:step,value:val});
  r.addEventListener("input",function(){n.value=r.value;fn(+r.value)});
  n.addEventListener("input",function(){if(n.value==="")return;r.value=n.value;fn(+n.value)});
  return el("div",{className:"p"},[el("span",{textContent:label}),r,n]);
}
function renderStack(){
  var box=$("st");box.innerHTML="";$("cnt").textContent=layers.length+" 枚";
  layers.forEach(function(L,i){
    var def=E[L.t],body=el("div",{className:"lb"}),card=el("div",{className:"L"+(L.on?"":" off")});
    var cb=el("input",{type:"checkbox",checked:!!L.on,title:"有効/無効"});
    cb.addEventListener("change",function(){L.on=cb.checked?1:0;card.className="L"+(L.on?"":" off");go()});
    var mv=function(d){var j=i+d;if(j<0||j>=layers.length)return;var x=layers[j];layers[j]=layers[i];layers[i]=x;renderStack();go()};
    var head=el("div",{className:"lh"},[cb,el("b",{textContent:String(i+1).padStart(2,"0")+" "+def.n}),
      btn("↑","上へ",function(){mv(-1)}),btn("↓","下へ",function(){mv(1)}),
      btn("乱","このレイヤーをランダム化",function(){rnd(L);renderStack();go()}),
      btn("複","複製",function(){layers.splice(i+1,0,JSON.parse(JSON.stringify(L)));renderStack();go()}),
      btn("×","削除",function(){layers.splice(i,1);renderStack();go()}),
      btn("−","折りたたみ",function(){body.style.display=body.style.display==="none"?"":"none"})]);
    body.appendChild(slider("不透明度 %",0,100,1,L.o,function(v){L.o=v;go()}));
    var ms=el("select",{},Object.keys(BM).map(function(k){return el("option",{value:k,textContent:BN[k],selected:k===L.m})}));
    ms.addEventListener("change",function(){L.m=ms.value;go()});
    body.appendChild(el("div",{className:"p"},[el("span",{textContent:"合成モード"}),ms,el("span")]));
    def.p.forEach(function(p){
      if(p[2]==="c"){var ci=el("input",{type:"color",value:L.v[p[0]]});ci.addEventListener("input",function(){L.v[p[0]]=ci.value;go()});
        body.appendChild(el("div",{className:"p"},[el("span",{textContent:p[1]}),el("span"),ci]))}
      else body.appendChild(slider(p[1],p[2],p[3],p[4],L.v[p[0]],function(v){L.v[p[0]]=v;go()}));
    });
    card.appendChild(head);card.appendChild(body);box.appendChild(card);
  });
}

function render(){
  if(!base)return;var t0=performance.now(),d=new Uint8ClampedArray(base.data);
  if(!showOrig)layers.forEach(function(L){
    if(!L.on)return;var s=new Uint8ClampedArray(d);E[L.t].fn(s,W,H,L.v);
    var op=L.o/100,f=BM[L.m];for(var i=0;i<d.length;i++){if((i&3)===3)continue;var a=d[i];d[i]=a+(f(a,s[i])-a)*op}});
  ctx.putImageData(new ImageData(d,W,H),0,0);
  $("info").textContent=W+"×"+H+" / "+Math.round(performance.now()-t0)+"ms";
}
function fit(){
  if(!src)return;var sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,m=+$("res").value,k=Math.min(1,m/Math.max(sw,sh));
  W=Math.max(1,Math.round(sw*k));H=Math.max(1,Math.round(sh*k));cv.width=W;cv.height=H;cv.style.display="block";$("empty").style.display="none";ctx.drawImage(src,0,0,W,H);base=ctx.getImageData(0,0,W,H);render();
}
function sample(){
  var c=el("canvas",{width:900,height:600}),g=c.getContext("2d"),gr=g.createLinearGradient(0,0,900,600);
  gr.addColorStop(0,"#2b6cb0");gr.addColorStop(.5,"#f6ad55");gr.addColorStop(1,"#c53030");g.fillStyle=gr;g.fillRect(0,0,900,600);
  g.fillStyle="#fff";g.beginPath();g.arc(300,300,170,0,7);g.fill();g.fillStyle="#111";g.beginPath();g.arc(300,300,100,0,7);g.fill();
  g.fillStyle="#38a169";g.fillRect(540,120,260,260);g.strokeStyle="#fff";g.lineWidth=10;
  for(var i=0;i<8;i++){g.beginPath();g.moveTo(80+i*100,590);g.lineTo(180+i*100,430);g.stroke()}
  g.fillStyle="#fff";g.font="bold 90px sans-serif";g.fillText("SAMPLE",520,520);return c;
}
function loadFile(f){if(!f||f.type.indexOf("image")!==0)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){src=im;fit()};im.src=r.result};r.readAsDataURL(f)}

var og={};Object.keys(E).forEach(function(k){var g=E[k].g;if(!og[g]){og[g]=el("optgroup",{label:g});$("add").appendChild(og[g])}og[g].appendChild(el("option",{value:k,textContent:E[k].n}))});
$("addb").addEventListener("click",function(){layers.push(mk($("add").value));renderStack();go()});
$("rall").addEventListener("click",function(){layers.forEach(rnd);renderStack();go()});
$("clr").addEventListener("click",function(){layers=[];renderStack();go()});
$("res").addEventListener("change",fit);
$("file").addEventListener("change",function(e){loadFile(e.target.files[0])});
document.addEventListener("dragover",function(e){e.preventDefault()});
document.addEventListener("drop",function(e){e.preventDefault();if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
var cmp=$("cmp");
["pointerdown"].forEach(function(n){cmp.addEventListener(n,function(){showOrig=1;render()})});
["pointerup","pointerleave","pointercancel"].forEach(function(n){cmp.addEventListener(n,function(){if(showOrig){showOrig=0;render()}})});
$("save").addEventListener("click",function(){
  showOrig=0;render();
  cv.toBlob(function(b){if(!b){say("保存失敗");return}var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="effect.png";document.body.appendChild(a);a.click();a.remove();say("保存を試みました")});
});
$("jx").addEventListener("click",function(){$("js").value=JSON.stringify(layers)});
$("ji").addEventListener("click",function(){
  try{var a=JSON.parse($("js").value);if(!Array.isArray(a))throw 0;
    layers=a.filter(function(x){return x&&E[x.t]}).map(function(x){var L=mk(x.t);L.on=x.on===0?0:1;L.o=typeof x.o==="number"?x.o:100;L.m=BM[x.m]?x.m:"normal";for(var k in L.v)if(x.v&&x.v[k]!==undefined)L.v[k]=x.v[k];return L});
    renderStack();go();say("読み込みました")}catch(e){say("JSONが不正です")}
});

renderStack();
})();
